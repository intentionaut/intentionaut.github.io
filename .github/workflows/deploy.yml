name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The site pulls beehiiv at build time, so a post published on beehiiv does
  # not appear at /writing/<slug>/ until a build runs. beehiiv webhooks are
  # Scale/Enterprise only (the API returns 403 ACCESS_FORBIDDEN on this plan),
  # so this is on a schedule instead. Nothing to trigger by hand.
  #
  # Times are UTC; GitHub cron has no timezone, so the UK clock change matters.
  # Saielle always publishes before 09:00 UK time, which is 08:00 UTC during
  # British Summer Time and 09:00 UTC once the clocks go back. So there is a
  # run after her latest possible publish time in both halves of the year:
  # 08:20 UTC covers summer, 09:20 UTC covers winter. 07:20 usually catches it
  # sooner than that, since issues have in practice sent around 07:00 UTC.
  # Midday and evening are safety nets for a failed earlier run.
  #
  # Minute 20 rather than 00 on purpose: runs scheduled on the hour queue
  # behind everyone else's and get delayed.
  schedule:
    - cron: '20 7,8,9,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
