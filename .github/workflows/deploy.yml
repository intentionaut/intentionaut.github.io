name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The site pulls beehiiv at build time, so a post published on beehiiv does
  # not appear at /writing/<slug>/ until a build runs. beehiiv webhooks are
  # Scale/Enterprise only (the API returns 403 ACCESS_FORBIDDEN on this plan),
  # so this is on a schedule instead. Nothing to trigger by hand.
  #
  # src/lib/beehiiv.ts holds every post back 3 days after it actually sends,
  # timed to the LinkedIn cadence (teasers week one, post live Monday week
  # two, next teasers Friday week two) - so a build catching a send within
  # minutes is no longer the point; the 3-day buffer already covers same-day
  # send-time drift. One run a day is enough to pick up whatever just cleared
  # its embargo. Minute 10 rather than 00 on purpose: runs scheduled on the
  # hour queue behind everyone else's and get delayed.
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
