name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The site pulls beehiiv at build time, so a post published on beehiiv does
  # not appear at /writing/<slug>/ until a build runs. beehiiv webhooks are
  # Scale/Enterprise only (the API returns 403 ACCESS_FORBIDDEN on this plan),
  # so this is on a schedule instead. Nothing to trigger by hand.
  #
  # src/lib/beehiiv.ts holds every post back 3 days after it actually sends,
  # timed to the LinkedIn cadence (teasers week one, post live Monday week
  # two, next teasers Friday week two) - so a build catching a send within
  # minutes is no longer the point; the 3-day buffer already covers same-day
  # send-time drift. One run a day is enough to pick up whatever just cleared
  # its embargo. Minute 10 rather than 00 on purpose: runs scheduled on the
  # hour queue behind everyone else's and get delayed.
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Scheduled runs only: skip the rebuild when the posts that belong on the
  # site haven't changed since the last deploy (scripts/posts-changed.mjs
  # compares beehiiv with /posts-fingerprint.txt on the live site). Pushes and
  # manual runs always build.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.posts.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: posts
        run: node scripts/posts-changed.mjs
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  # GitHub switches off scheduled workflows in a public repo after 60 days with
  # no commits. Re-enabling it through the API resets that clock without an
  # empty commit, so the daily check keeps running between pushes.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  deploy:
    needs: build
    # Explicit, because on a push the skipped check job upstream would
    # otherwise skip this too, and the build would never go live.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
