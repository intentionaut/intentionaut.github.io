name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The site pulls beehiiv at build time, so a post published on beehiiv does
  # not appear at /writing/<slug>/ until a build runs. beehiiv webhooks are
  # Scale/Enterprise only (the API returns 403 ACCESS_FORBIDDEN on this plan),
  # so this is on a schedule instead. Nothing to trigger by hand.
  #
  # Times are UTC; GitHub cron has no timezone, so the UK clock change matters.
  #
  # Saielle's default send time is 06:40 UK. That is 05:40 UTC during British
  # Summer Time and 06:40 UTC once the clocks go back, so the two morning runs
  # sit fifteen minutes after it in each half of the year:
  #
  #        UTC     BST local    GMT local
  #        05:55   06:55  <-    05:55
  #        06:55   07:55        06:55  <-
  #
  # A new issue is therefore on the site, and in the sitemap, about a quarter
  # of an hour after it lands in inboxes. The 09:20 run catches an issue sent
  # later than usual; 18:20 recovers a failed morning run.
  #
  # Minute 55 and 20 rather than 00 on purpose: runs scheduled on the hour
  # queue behind everyone else's and get delayed.
  schedule:
    - cron: '55 5,6 * * *'
    - cron: '20 9,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
