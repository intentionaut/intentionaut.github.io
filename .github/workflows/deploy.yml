name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The site pulls beehiiv at build time, so a post published on beehiiv does
  # not appear at /writing/<slug>/ until a build runs. beehiiv webhooks are
  # Scale/Enterprise only (the API returns 403 ACCESS_FORBIDDEN on this plan),
  # so this is on a schedule instead. Nothing to trigger by hand.
  #
  # Times are UTC; GitHub cron has no timezone, so the UK clock change matters.
  #
  # Saielle aims to send between 06:30 and 07:30 UK time, to catch the commute.
  # Actual sends have landed a little later, clustering 07:45 to 08:10 local.
  # These four morning runs cover the union of both, in summer and winter:
  #
  #        UTC     BST local    GMT local
  #        05:50   06:50        05:50
  #        06:50   07:50        06:50
  #        07:50   08:50        07:50
  #        08:50   09:50        08:50
  #
  # So whatever hour inside 06:30 to 08:10 local an issue actually sends, in
  # either half of the year, a build follows within about forty-five minutes
  # and usually much less. Midday and evening catch an off-pattern send or
  # recover a failed morning run.
  #
  # Minute 50 and 20 rather than 00 on purpose: runs scheduled on the hour
  # queue behind everyone else's and get delayed.
  schedule:
    - cron: '50 5,6,7,8 * * *'
    - cron: '20 12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
